<html lang="ko">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Sans:wght@500;700&display=swap');

:root {
  --navy:#0D1B3E; --navy-mid:#162D5E;
  --accent:#3A6FE8; --accent-soft:#EEF2FB;
  --white:#fff; --bg:#F4F6FB;
  --border:#DDE3F0; --text:#0D1B3E; --muted:#7A89A8;
  --green:#1DB37A;
  --ch:32px; /* chip height */
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html { height:100%; }

body {
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh; /* Safari 동적 뷰포트 */
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ── TOPBAR ── */
.topbar {
  background:var(--navy);
  padding:10px 14px 8px;
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0;
}
.p-icon {
  width:30px; height:30px;
  background:var(--accent);
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:700; color:#fff;
  flex-shrink:0;
}
.app-title {
  font-family:'DM Sans',sans-serif;
  font-size:17px; font-weight:700; color:#fff; letter-spacing:-.3px;
  line-height:1;
}
.app-sub {
  font-size:9px; color:rgba(255,255,255,.35);
  margin-top:2px; letter-spacing:.04em;
}

/* ── CAR TABS ── */
.car-tabs-wrap {
  background:var(--navy-mid);
  padding:7px 14px 0;
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:5px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.car-tabs-wrap::-webkit-scrollbar { display:none; }

.car-tab {
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 11px 7px;
  border-radius:8px 8px 0 0;
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.5);
  font-size:12px; font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:background .12s,color .12s;
  flex-shrink:0;
  font-family:inherit;
  border:none;
  position:relative;
}
.car-tab.active {
  background:var(--bg);
  color:var(--navy);
  font-weight:700;
}
.tab-del {
  font-size:10px;
  opacity:.5;
  line-height:1;
  padding:1px 2px;
  border-radius:3px;
}
.tab-del:active { opacity:1; background:rgba(0,0,0,.15); }
.tab-add {
  padding:6px 10px 7px;
  border-radius:8px 8px 0 0;
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.4);
  font-size:15px; line-height:1;
  cursor:pointer;
  flex-shrink:0;
  border:none;
  font-family:inherit;
  transition:background .12s;
}
.tab-add:active { background:rgba(255,255,255,.15); }

/* car name edit bar */
.car-bar {
  background:var(--bg);
  padding:6px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.car-icon { font-size:13px; }
.car-lbl { font-size:10px; color:var(--muted); white-space:nowrap; }
.car-display {
  flex:1; display:flex; align-items:center; gap:5px;
  font-size:13px; font-weight:500; color:var(--navy);
  cursor:pointer;
}
.pen { font-size:10px; opacity:.4; }
.car-edit { flex:1; display:none; align-items:center; gap:5px; }
.car-edit.open { display:flex; }
.car-inp {
  flex:1; padding:4px 8px;
  border-radius:7px; border:1.5px solid var(--border);
  background:#fff; color:var(--navy);
  font-size:13px; font-weight:500; font-family:inherit;
  outline:none;
}
.car-inp:focus { border-color:var(--accent); }
.car-save {
  padding:4px 10px; border-radius:7px; border:none;
  background:var(--navy); color:#fff;
  font-size:12px; cursor:pointer; font-family:inherit; font-weight:500;
}

/* ── BANNER ── */
.banner {
  margin:8px 10px 0;
  background:var(--white);
  border-radius:12px;
  padding:10px 14px;
  border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(13,27,62,.06);
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.banner-left { flex:1; min-width:0; }
.banner-lbl {
  font-size:9px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}
.banner-val {
  font-size:19px; font-weight:700; color:var(--navy);
  letter-spacing:-.5px; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.banner-val.empty { font-size:13px; font-weight:400; color:#BBC5D8; }
.banner-time { font-size:10px; color:var(--muted); margin-top:3px; }
.status-dot {
  width:9px; height:9px; border-radius:50%;
  background:#D0D8EC; flex-shrink:0;
  transition:background .3s;
}
.status-dot.on { background:var(--green); box-shadow:0 0 0 3px rgba(29,179,122,.15); }

/* ── SECTIONS ── */
.sections-scroll {
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:8px 10px 8px;
  display:flex;
  flex-direction:column;
}
.sections-scroll::-webkit-scrollbar { display:none; }

.sec {
  background:var(--white);
  border:1px solid var(--border);
  position:relative;
}
.sec:first-child { border-radius:12px 12px 0 0; }
.sec:last-child { border-radius:0 0 12px 12px; }
.sec:only-child { border-radius:12px; }
.sec+.sec { border-top:none; }
.sec.dragging {
  box-shadow:0 8px 24px rgba(13,27,62,.18)!important;
  z-index:100; border-radius:12px!important;
  border-top:1px solid var(--border)!important;
}

.sec-inner { padding:8px 12px 10px; }

.sec-head {
  display:flex; align-items:center; gap:6px; margin-bottom:7px;
}
.drag-h {
  display:flex; flex-direction:column; gap:2.5px;
  padding:3px 2px; cursor:grab; opacity:.22; flex-shrink:0;
  touch-action:none;
}
.drag-h:active { cursor:grabbing; opacity:.5; }
.drag-h span { display:block; width:14px; height:1.5px; background:var(--text); border-radius:2px; }
.sec-title {
  font-size:9px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); flex:1;
}
.sec-add {
  font-size:11px; color:var(--accent); background:none; border:none;
  cursor:pointer; font-family:inherit; font-weight:500; padding:2px 5px; border-radius:5px;
}
.sec-add:active { background:var(--accent-soft); }

.chips { display:flex; flex-wrap:wrap; gap:5px; overflow:hidden; }
.chips.collapsed { max-height:var(--ch); }
.chips.expanded { max-height:999px; }

.xbtn {
  display:block; width:100%; margin-top:5px;
  font-size:10px; color:var(--accent);
  background:var(--accent-soft); border:none; border-radius:6px;
  padding:5px; cursor:pointer; font-family:inherit; font-weight:600; text-align:center;
}
.xbtn.hide { display:none; }

.chip {
  height:var(--ch); padding:0 12px;
  border-radius:999px; border:1.5px solid var(--border);
  background:var(--white); color:var(--text);
  font-size:12px; font-weight:500; cursor:pointer; font-family:inherit;
  transition:background .1s,border-color .1s,color .1s;
  user-select:none; white-space:nowrap;
  display:inline-flex; align-items:center; position:relative;
}
.chip:active { transform:scale(.93); }
.chip.on { background:var(--navy); border-color:var(--navy); color:#fff; }
.chip.sm { padding:0; width:34px; justify-content:center; font-size:11px; }
.dx {
  display:none; position:absolute; top:-5px; right:-5px;
  width:14px; height:14px; border-radius:50%;
  background:#8A9BB8; color:#fff;
  font-size:8px; line-height:14px; text-align:center;
  cursor:pointer; font-weight:700;
}
.chip.on .dx { display:block; }

.add-row { display:none; align-items:center; gap:6px; margin-top:7px; }
.add-row.open { display:flex; }
.add-inp {
  padding:7px 10px; border-radius:8px;
  border:1.5px solid var(--border); background:var(--bg);
  color:var(--text); font-size:13px; outline:none; font-family:inherit;
}
.add-inp:focus { border-color:var(--accent); background:#fff; }
.add-ok {
  padding:7px 11px; border-radius:8px; border:none;
  background:var(--navy); color:#fff;
  font-size:12px; cursor:pointer; font-family:inherit; font-weight:500;
}
.add-no {
  padding:7px; background:none; border:none;
  color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit;
}
.cu-hint { font-size:10px; color:#BBC5D8; margin-top:5px; font-style:italic; }

/* ── PWA 설치 배너 ── */
.pwa-banner {
  display:none;
  position:fixed;
  bottom:0; left:0; right:0;
  background:var(--navy);
  padding:12px 16px;
  z-index:999;
  align-items:center;
  gap:10px;
  border-top:1px solid rgba(255,255,255,.1);
  animation: slideUp .3s ease;
}
@keyframes slideUp {
  from { transform:translateY(100%); }
  to { transform:translateY(0); }
}
.pwa-banner.show { display:flex; }
.pwa-txt { flex:1; }
.pwa-txt-main { font-size:13px; font-weight:600; color:#fff; }
.pwa-txt-sub { font-size:11px; color:rgba(255,255,255,.5); margin-top:2px; }
.pwa-install {
  padding:8px 14px; border-radius:8px;
  background:var(--accent); border:none;
  color:#fff; font-size:12px; font-weight:600;
  cursor:pointer; font-family:inherit; white-space:nowrap;
}
.pwa-close {
  background:none; border:none;
  color:rgba(255,255,255,.4); font-size:18px;
  cursor:pointer; padding:4px; line-height:1;
}
.gamil-tag {
  font-family:'DM Sans',sans-serif;
  font-size:8px; color:rgba(255,255,255,0.28);
  letter-spacing:.1em; text-align:right; line-height:1.5;
  text-transform:uppercase;
}
.gamil-tag strong { display:block; font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:.06em; }

/* ── AD BANNER ── */
.ad-banner {
  flex-shrink:0;
  margin:0 10px;
  margin-bottom: max(8px, env(safe-area-inset-bottom));
  border-radius:10px;
  overflow:hidden;
  border:1px solid var(--border);
}
.ad-inner {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 14px;
  background:linear-gradient(135deg,#0D1B3E 0%,#1A3260 100%);
  text-decoration:none;
  cursor:default;
}
.ad-slogan {
  text-align:center;
}
.ad-slogan-main {
  font-size:12px; font-weight:700;
  color:#fff; letter-spacing:-.2px;
  font-family:'Noto Sans KR',sans-serif;
}
.ad-slogan-sub {
  font-size:9px; color:rgba(255,255,255,.45);
  margin-top:1px; letter-spacing:.06em;
}
.ad-label {
  font-size:8px; color:rgba(255,255,255,.2);
  letter-spacing:.08em; text-transform:uppercase;
  border:1px solid rgba(255,255,255,.12);
  padding:2px 5px; border-radius:3px;
  flex-shrink:0;
}
.credit-bar {
  text-align:center;
  padding:5px 0 max(12px, env(safe-area-inset-bottom));
  font-size:9px; color:#C8D0E0; letter-spacing:.05em;
  flex-shrink:0;
}
</style>
</head>
<body>

<!-- PWA 설치 유도 배너 -->

  <div>
    <div class="app-title">차어디 🅿️</div>
    <div class="app-sub">주차 위치 확인기</div>
  </div>
  <div style="flex:1"></div>
  <div class="gamil-tag">

<!-- CAR TABS -->
<div class="car-tabs-wrap" id="car-tabs"></div>

<!-- CAR NAME BAR -->
<div class="car-bar">

  <span class="car-lbl">내 차</span>
  <div class="car-display" id="car-display" onclick="openCarEdit()">
    <span id="car-name-txt">부릉이</span>

<!-- BANNER -->
<div class="banner">
  <div class="banner-left">
    <div class="banner-lbl">저장된 위치</div>

</div>

<!-- SECTIONS -->
<div class="sections-scroll" id="sections-wrap">
  <div class="sec" data-key="fl">

      <div class="sec-head">
        <div class="drag-h"><span></span><span></span><span></span></div>

  <div class="sec" data-key="zo">

      <div class="sec-head">
        <div class="drag-h"><span></span><span></span><span></span></div>

      </div>

      <button class="xbtn" id="zo-xbtn" onclick="toggleExp('zo')">▾ 더보기</button>

  <div class="sec" data-key="nu">

      <div class="sec-head">
        <div class="drag-h"><span></span><span></span><span></span></div>

      <button class="xbtn" id="nu-xbtn" onclick="toggleExp('nu')">▾ 더보기</button>

        <input class="add-inp" id="cu-i" placeholder="5글자 이내" maxlength="5"
          style="width:110px" onkeydown="if(event.key==='Enter')doAdd('cu')">
        <button class="add-ok" onclick="doAdd('cu')">확인</button>
        <button class="add-no" onclick="closeAdd('cu')">취소</button>

</div>

<!-- 광고 배너 -->

</div>

<script>
var ZONES='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var DNUMS=Array.from({length:20},function(_,i){return String(i+1);});
var DEF_FLOORS=['B1','B2','지상'];
var expState={zo:false,nu:false};

/* ── STATE ── */
var S={
  cars:[{name:'부릉이',floors:['B1','B2','지상'],xnums:[],customs:[],sel:{fl:null,zo:null,nu:null,cu:null},at:null,secOrder:['fl','zo','nu','cu']}],
  active:0
};

function load(){try{var d=JSON.parse(localStorage.getItem('chaeodie_v3')||'null');if(d)S=d;}catch(e){}}
function persist(){try{localStorage.setItem('chaeodie_v3',JSON.stringify(S));}catch(e){}}
function car(){return S.cars[S.active];}

/* ── CAR TABS ── */
function renderTabs(){
  var wrap=document.getElementById('car-tabs');
  wrap.innerHTML='';
  S.cars.forEach(function(c,i){
    var btn=document.createElement('button');
    btn.className='car-tab'+(i===S.active?' active':'');
    btn.innerHTML=c.name+(S.cars.length>1?'<span class="tab-del" onclick="delCar('+i+',event)">✕</span>':'');
    btn.onclick=function(e){if(e.target.classList.contains('tab-del'))return;switchCar(i);};
    wrap.appendChild(btn);
  });
  var add=document.createElement('button');
  add.className='tab-add';
  add.textContent='+';
  add.title='차량 추가';
  add.onclick=addCar;
  wrap.appendChild(add);
}

function switchCar(i){
  S.active=i;
  persist();
  renderTabs();
  restoreOrder();
  render();
  upd();
  document.getElementById('car-name-txt').textContent=car().name||'내 차';
  closeCarEdit();
}

function addCar(){
  var name=prompt('새 차 이름을 입력하세요 (5자 이내)','');
  if(name===null)return;
  name=name.trim().slice(0,5)||'차'+(S.cars.length+1);
  S.cars.push({name:name,floors:['B1','B2','지상'],xnums:[],customs:[],sel:{fl:null,zo:null,nu:null,cu:null},at:null,secOrder:['fl','zo','nu','cu']});
  S.active=S.cars.length-1;
  persist();
  renderTabs();
  restoreOrder();
  render();
  upd();
  document.getElementById('car-name-txt').textContent=name;
}

function delCar(i,e){
  e.stopPropagation();
  if(S.cars.length===1){alert('차량이 1대일 때는 삭제할 수 없어요.');return;}
  if(!confirm('['+S.cars[i].name+'] 차량을 삭제할까요?'))return;
  S.cars.splice(i,1);
  if(S.active>=S.cars.length)S.active=S.cars.length-1;
  persist();
  renderTabs();
  restoreOrder();
  render();
  upd();
  document.getElementById('car-name-txt').textContent=car().name||'내 차';
}

/* ── CAR NAME EDIT ── */
function openCarEdit(){
  document.getElementById('car-display').style.display='none';
  document.getElementById('car-edit').classList.add('open');
  var inp=document.getElementById('car-inp');
  inp.value=car().name||'';
  setTimeout(function(){inp.focus();inp.select();},50);
}
function closeCarEdit(){
  document.getElementById('car-edit').classList.remove('open');
  document.getElementById('car-display').style.display='flex';
}
function saveCarName(){
  var v=document.getElementById('car-inp').value.trim();
  if(v)car().name=v;
  persist();
  document.getElementById('car-name-txt').textContent=car().name||'내 차';
  renderTabs();
  closeCarEdit();
  upd();
}

/* ── DISPLAY ── */
function upd(){
  var c=car();
  var parts=[c.sel.fl,c.sel.zo,c.sel.nu,c.sel.cu].filter(Boolean);
  var bv=document.getElementById('bv'),bt=document.getElementById('bt'),dot=document.getElementById('sdot');
  if(parts.length){
    bv.textContent=(c.name||'내 차')+'  ·  '+parts.join(' · ');
    bv.classList.remove('empty');
    dot.classList.add('on');
    if(c.at){var d=new Date(c.at);bt.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' 저장됨';}
  }else{
    bv.textContent='아직 저장된 위치가 없어요';
    bv.classList.add('empty');
    dot.classList.remove('on');
    bt.textContent='';
  }
}

/* ── TAP ── */
function tap(cat,val){
  var c=car();
  c.sel[cat]=c.sel[cat]===val?null:val;
  c.at=Date.now();
  persist();render();upd();
}
function delFloor(val,e){
  e.stopPropagation();
  var c=car();
  c.floors=c.floors.filter(function(v){return v!==val;});
  if(c.sel.fl===val)c.sel.fl=null;
  persist();render();upd();
}
function delCustom(val,e){
  e.stopPropagation();
  var c=car();
  c.customs=c.customs.filter(function(v){return v!==val;});
  if(c.sel.cu===val)c.sel.cu=null;
  persist();render();upd();
}

/* ── RENDER ── */
function render(){
  var c=car();
  document.getElementById('fl-chips').innerHTML=c.floors.map(function(v,i){
    var on=c.sel.fl===v,canDel=!DEF_FLOORS.includes(v);
    return '<button class="chip'+(on?' on':'')+'" onclick="tap(\'fl\',\''+v+'\')">'+v
      +(canDel?'<span class="dx" onclick="delFloor(\''+v+'\',event)">✕</span>':'')+'</button>';
  }).join('');

  document.getElementById('zo-chips').innerHTML=ZONES.map(function(v){
    return '<button class="chip sm'+(c.sel.zo===v?' on':'')+'" onclick="tap(\'zo\',\''+v+'\')">'+v+'</button>';
  }).join('');

  var allNums=DNUMS.concat(c.xnums);
  document.getElementById('nu-chips').innerHTML=allNums.map(function(v){
    return '<button class="chip sm'+(c.sel.nu===v?' on':'')+'" onclick="tap(\'nu\',\''+v+'\')">'+v+'</button>';
  }).join('');

  var ce=document.getElementById('cu-chips'),ch=document.getElementById('cu-hint');
  if(!c.customs.length){ce.innerHTML='';ch.style.display='block';}
  else{
    ch.style.display='none';
    ce.innerHTML=c.customs.map(function(v){
      return '<button class="chip'+(c.sel.cu===v?' on':'')+'" onclick="tap(\'cu\',\''+v+'\')">'
        +v+'<span class="dx" onclick="delCustom(\''+v+'\',event)">✕</span></button>';
    }).join('');
  }
  applyRadius();
}

function applyRadius(){
  var secs=document.querySelectorAll('#sections-wrap .sec');
  secs.forEach(function(s,i){
    s.style.borderRadius='';s.style.borderTop='';
    if(i===0)s.style.borderRadius='12px 12px 0 0';
    if(i===secs.length-1)s.style.borderRadius=(secs.length===1?'12px':'0 0 12px 12px');
    if(i>0)s.style.borderTop='none';
  });
}

/* ── EXPAND ── */
function toggleExp(key){
  expState[key]=!expState[key];
  var el=document.getElementById(key+'-chips'),btn=document.getElementById(key+'-xbtn');
  if(expState[key]){el.classList.remove('collapsed');el.classList.add('expanded');btn.textContent='▴ 접기';}
  else{el.classList.remove('expanded');el.classList.add('collapsed');btn.textContent='▾ 더보기';}
}

/* ── ADD ── */
function openAdd(t){
  ['fl','nu','cu'].forEach(function(x){document.getElementById(x+'-add').classList.remove('open');document.getElementById(x+'-i').value='';});
  document.getElementById(t+'-add').classList.add('open');
  setTimeout(function(){document.getElementById(t+'-i').focus();},50);
}
function closeAdd(t){document.getElementById(t+'-add').classList.remove('open');document.getElementById(t+'-i').value='';}
function doAdd(t){
  var v=document.getElementById(t+'-i').value.trim();if(!v)return;
  var c=car();
  if(t==='fl'&&!c.floors.includes(v))c.floors.push(v);
  else if(t==='nu'&&!DNUMS.includes(v)&&!c.xnums.includes(v))c.xnums.push(v);
  else if(t==='cu'&&!c.customs.includes(v))c.customs.push(v);
  closeAdd(t);persist();render();upd();
}

/* ── DRAG ── */
(function(){
  var wrap=document.getElementById('sections-wrap');
  var dragging=null,placeholder=null,dragOffsetY=0;
  function getH(el){return el.classList.contains('drag-h')?el:el.closest('.drag-h');}
  function start(sec,y){
    dragging=sec;var r=sec.getBoundingClientRect();dragOffsetY=y-r.top;
    sec.classList.add('dragging');
    sec.style.cssText='position:fixed;left:'+r.left+'px;width:'+r.width+'px;top:'+(y-dragOffsetY)+'px;z-index:999;';
    placeholder=document.createElement('div');
    placeholder.style.cssText='height:'+r.height+'px;background:var(--accent-soft);border-radius:10px;border:2px dashed var(--border);';
    wrap.insertBefore(placeholder,sec.nextSibling);
  }
  function move(y){
    if(!dragging)return;
    dragging.style.top=(y-dragOffsetY)+'px';
    var secs=Array.from(wrap.querySelectorAll('.sec:not(.dragging)'));
    var ins=null;
    for(var i=0;i<secs.length;i++){var r=secs[i].getBoundingClientRect();if(y<r.top+r.height/2){ins=secs[i];break;}}
    ins?wrap.insertBefore(placeholder,ins):wrap.appendChild(placeholder);
  }
  function end(){
    if(!dragging)return;
    dragging.style.cssText='';dragging.classList.remove('dragging');
    wrap.insertBefore(dragging,placeholder);placeholder.remove();placeholder=null;
    car().secOrder=Array.from(wrap.querySelectorAll('.sec')).map(function(s){return s.dataset.key;});
    persist();applyRadius();dragging=null;
  }
  wrap.addEventListener('mousedown',function(e){var h=getH(e.target);if(!h)return;var s=h.closest('.sec');if(!s)return;e.preventDefault();start(s,e.clientY);});
  document.addEventListener('mousemove',function(e){move(e.clientY);});
  document.addEventListener('mouseup',end);
  wrap.addEventListener('touchstart',function(e){var h=getH(e.target);if(!h)return;var s=h.closest('.sec');if(!s)return;e.preventDefault();start(s,e.touches[0].clientY);},{passive:false});
  document.addEventListener('touchmove',function(e){if(dragging){e.preventDefault();move(e.touches[0].clientY);}},{passive:false});
  document.addEventListener('touchend',end);
})();

/* ── ORDER RESTORE ── */
function restoreOrder(){
  var c=car();if(!c.secOrder)return;
  var wrap=document.getElementById('sections-wrap');
  c.secOrder.forEach(function(k){var el=wrap.querySelector('[data-key="'+k+'"]');if(el)wrap.appendChild(el);});
}

/* ── INIT ── */
load();
renderTabs();
restoreOrder();
document.getElementById('car-name-txt').textContent=car().name||'부릉이';
render();
upd();

/* ── PWA ── */
var deferredPrompt = null;

// 서비스워커 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', {scope: './'})
    .catch(function(e){ console.log('SW 등록 실패:', e); });
}

// 안드로이드 설치 배너
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  // 이미 설치했으면 안 보여줌
  if (!localStorage.getItem('pwa_installed')) {
    setTimeout(function(){
      document.getElementById('pwa-banner').classList.add('show');
    }, 2000);
  }
});

document.getElementById('pwa-install-btn').addEventListener('click', function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
      if (result.outcome === 'accepted') {
        localStorage.setItem('pwa_installed', '1');
        gtag('event', 'pwa_install', {region: 'gamil'});
      }
      deferredPrompt = null;
      document.getElementById('pwa-banner').classList.remove('show');
    });
  }
});

function closePwaBanner() {
  document.getElementById('pwa-banner').classList.remove('show');
  localStorage.setItem('pwa_banner_closed', '1');
}

// iOS는 beforeinstallprompt 없음 → 배너로 안내
var isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
var isInStandaloneMode = ('standalone' in navigator) && navigator.standalone;
if (isIos && !isInStandaloneMode && !localStorage.getItem('pwa_installed') && !localStorage.getItem('pwa_banner_closed')) {
  setTimeout(function(){
    var banner = document.getElementById('pwa-banner');
    var btn = document.getElementById('pwa-install-btn');
    var txt = banner.querySelector('.pwa-txt-main');
    var sub = banner.querySelector('.pwa-txt-sub');
    txt.textContent = '📱 홈화면에 추가하면 앱처럼 써요';
    sub.innerHTML = '하단 공유버튼 □↑ → "홈 화면에 추가"';
    btn.textContent = '닫기';
    btn.onclick = function(){ closePwaBanner(); };
    banner.classList.add('show');
  }, 2000);
}
</script>
