<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>차어디 🅿️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --navy: #0D1B3E;
  --navy-mid: #1A3260;
  --accent: #2B5CE6;
  --accent-soft: #EEF2FB;
  --white: #FFFFFF;
  --off-white: #F7F8FC;
  --border: #DDE3F0;
  --border-light: #EEF1F8;
  --text: #0D1B3E;
  --muted: #7A89A8;
  --chip-h: 36px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── TOP BAR ── */
.topbar {
  background: var(--navy);
  padding: 14px 18px 12px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.app-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--white);
  letter-spacing: -0.3px;
}
.app-title em {
  font-style: normal;
  color: #7EB3FF;
  font-size: 12px;
  font-weight: 400;
  display: block;
  letter-spacing: 0.02em;
  margin-bottom: 3px;
  font-family: 'DM Sans', sans-serif;
}
.apt-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  font-weight: 500;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.6;
}
.apt-brand {
  font-size: 8px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.06em;
  margin-top: 2px;
}

/* ── CAR BAR ── */
.car-bar {
  background: var(--navy-mid);
  padding: 9px 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.car-icon { font-size: 14px; }
.car-label {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
}
.car-name-display {
  flex: 1;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.car-name-text { }
.pen-icon {
  font-size: 12px;
  opacity: 0.5;
  flex-shrink: 0;
}
.car-input-wrap { flex: 1; display: none; align-items: center; gap: 6px; }
.car-input-wrap.open { display: flex; }
.car-input {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 8px;
  outline: none;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  font-family: 'Noto Sans KR', sans-serif;
  padding: 5px 9px;
  flex: 1;
  min-width: 0;
}
.car-input::placeholder { color: rgba(255,255,255,0.3); }
.car-save-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 7px;
  color: #fff;
  font-size: 12px;
  padding: 5px 10px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

/* ── BANNER ── */
.banner {
  margin: 14px 14px 0;
  background: var(--white);
  border-radius: 16px;
  padding: 16px 18px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(13,27,62,0.06);
}
.banner-lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.banner-val {
  font-size: 26px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.8px;
  min-height: 32px;
  line-height: 1.2;
}
.banner-val.empty {
  font-size: 15px;
  font-weight: 400;
  color: #BBC5D8;
  letter-spacing: 0;
}
.banner-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}

/* ── SECTIONS WRAPPER ── */
.sections {
  padding: 10px 14px 6px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── SECTION CARD ── */
.sec {
  background: var(--white);
  border: 1px solid var(--border);
  box-shadow: 0 1px 6px rgba(13,27,62,0.04);
  transition: box-shadow 0.2s;
  position: relative;
}
.sec:first-child { border-radius: 16px 16px 0 0; }
.sec:last-child { border-radius: 0 0 16px 16px; }
.sec:only-child { border-radius: 16px; }
.sec + .sec { border-top: none; }
.sec.dragging {
  box-shadow: 0 8px 24px rgba(13,27,62,0.18);
  z-index: 100;
  opacity: 0.95;
  border-radius: 16px !important;
  border-top: 1px solid var(--border) !important;
}

.sec-inner { padding: 12px 14px; }

.sec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

/* drag handle */
.drag-handle {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 4px 2px;
  cursor: grab;
  opacity: 0.3;
  flex-shrink: 0;
  touch-action: none;
}
.drag-handle:active { cursor: grabbing; opacity: 0.6; }
.drag-handle span {
  display: block;
  width: 16px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
}

.sec-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  flex: 1;
}
.sec-add {
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 6px;
}
.sec-add:active { background: var(--accent-soft); }

/* chips */
.chips-scroll {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.chips-scroll.collapsed { max-height: var(--chip-h); }
.chips-scroll.expanded { max-height: 999px; }

.expand-btn {
  display: none;
  width: 100%;
  margin-top: 7px;
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-soft);
  border: none;
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  text-align: center;
}
.expand-btn.visible { display: block; }

.chip {
  height: var(--chip-h);
  padding: 0 15px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: background .1s, border-color .1s, color .1s;
  user-select: none;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  position: relative;
}
.chip:active { transform: scale(0.95); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip.sm { padding: 0; width: 38px; justify-content: center; font-size: 12px; }
.del-x {
  display: none;
  position: absolute;
  top: -6px; right: -6px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #99A8C0;
  color: #fff;
  font-size: 9px;
  line-height: 16px;
  text-align: center;
  cursor: pointer;
  font-weight: 700;
}
.chip.on .del-x { display: block; }

/* add row */
.add-row {
  display: none;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
}
.add-row.open { display: flex; }
.add-inp {
  padding: 9px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--off-white);
  color: var(--text);
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
.add-inp:focus { border-color: var(--accent); background: #fff; }
.add-ok {
  padding: 9px 13px;
  border-radius: 10px;
  border: none;
  background: var(--navy);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.add-cancel {
  padding: 9px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

.cu-hint {
  font-size: 11px;
  color: #BBC5D8;
  margin-top: 6px;
  font-style: italic;
}

/* bottom */
.bottom-area {
  text-align: center;
  padding: 16px 14px 32px;
}
.clear-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 7px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
}
.clear-btn:active { background: var(--border-light); }
.credit {
  margin-top: 14px;
  font-size: 10px;
  color: #BBC5D8;
  letter-spacing: .04em;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="app-title">
    <em>주차 위치 확인기</em>
    차어디 🅿️
  </div>
  <div class="apt-name">
    Gamil Park Centreville
    <div class="apt-brand">Dongbu Corporation</div>
  </div>
</div>

<!-- CAR BAR -->
<div class="car-bar">
  <span class="car-icon">🚗</span>
  <span class="car-label">내 차</span>
  <div class="car-name-display" id="car-display" onclick="openCarEdit()">
    <span class="car-name-text" id="car-name-text">부릉이</span>
    <span class="pen-icon">✏️</span>
  </div>
  <div class="car-input-wrap" id="car-edit">
    <input class="car-input" id="car-input" type="text" placeholder="차 이름 (5자 이내)" maxlength="5"
      onkeydown="if(event.key==='Enter')saveCarName()">
    <button class="car-save-btn" onclick="saveCarName()">완료</button>
  </div>
</div>

<!-- BANNER -->
<div class="banner">
  <div class="banner-lbl">저장된 위치</div>
  <div class="banner-val empty" id="bv">아직 저장된 위치가 없어요</div>
  <div class="banner-time" id="bt"></div>
</div>

<!-- SECTIONS (순서 변경 가능) -->
<div class="sections" id="sections-wrap">

  <div class="sec" data-key="fl">
    <div class="sec-inner">
      <div class="sec-head">
        <div class="drag-handle" title="길게 눌러 순서 변경">
          <span></span><span></span><span></span>
        </div>
        <span class="sec-title">층</span>
        <button class="sec-add" onclick="openAdd('fl')">+ 추가</button>
      </div>
      <div class="chips-scroll expanded" id="fl-chips"></div>
      <div class="add-row" id="fl-add">
        <input class="add-inp" id="fl-i" placeholder="예: B3" maxlength="4" style="width:80px"
          onkeydown="if(event.key==='Enter')doAdd('fl')">
        <button class="add-ok" onclick="doAdd('fl')">확인</button>
        <button class="add-cancel" onclick="closeAdd('fl')">취소</button>
      </div>
    </div>
  </div>

  <div class="sec" data-key="zo">
    <div class="sec-inner">
      <div class="sec-head">
        <div class="drag-handle" title="길게 눌러 순서 변경">
          <span></span><span></span><span></span>
        </div>
        <span class="sec-title">구역 A – Z</span>
      </div>
      <div id="zo-wrap">
        <div class="chips-scroll collapsed" id="zo-chips"></div>
        <button class="expand-btn visible" id="zo-exp" onclick="toggleExpand('zo')">▾ 더보기</button>
      </div>
    </div>
  </div>

  <div class="sec" data-key="nu">
    <div class="sec-inner">
      <div class="sec-head">
        <div class="drag-handle" title="길게 눌러 순서 변경">
          <span></span><span></span><span></span>
        </div>
        <span class="sec-title">번호</span>
        <button class="sec-add" onclick="openAdd('nu')">+ 추가</button>
      </div>
      <div id="nu-wrap">
        <div class="chips-scroll collapsed" id="nu-chips"></div>
        <button class="expand-btn visible" id="nu-exp" onclick="toggleExpand('nu')">▾ 더보기</button>
      </div>
      <div class="add-row" id="nu-add">
        <input class="add-inp" id="nu-i" placeholder="예: 35" maxlength="4"
          inputmode="numeric" style="width:80px" onkeydown="if(event.key==='Enter')doAdd('nu')">
        <button class="add-ok" onclick="doAdd('nu')">확인</button>
        <button class="add-cancel" onclick="closeAdd('nu')">취소</button>
      </div>
    </div>
  </div>

  <div class="sec" data-key="cu">
    <div class="sec-inner">
      <div class="sec-head">
        <div class="drag-handle" title="길게 눌러 순서 변경">
          <span></span><span></span><span></span>
        </div>
        <span class="sec-title">커스텀</span>
        <button class="sec-add" onclick="openAdd('cu')">+ 추가</button>
      </div>
      <div class="chips-scroll expanded" id="cu-chips"></div>
      <div class="cu-hint" id="cu-hint">+ 추가로 나만의 항목을 넣어보세요 (왼쪽문, 기둥옆 …)</div>
      <div class="add-row" id="cu-add">
        <input class="add-inp" id="cu-i" placeholder="5글자 이내" maxlength="5"
          style="width:110px" onkeydown="if(event.key==='Enter')doAdd('cu')">
        <button class="add-ok" onclick="doAdd('cu')">확인</button>
        <button class="add-cancel" onclick="closeAdd('cu')">취소</button>
      </div>
    </div>
  </div>

</div>

<div class="bottom-area">
  <button class="clear-btn" onclick="clearSel()">저장 위치 초기화</button>
  <div class="credit">made by @chaeodie</div>
</div>

<script>
var ZONES = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var DNUMS = Array.from({length:20}, function(_,i){ return String(i+1); });
var expandState = { zo: false, nu: false };

var S = {
  floors: ['B1','B2'],
  xnums: [],
  customs: [],
  sel: { fl:null, zo:null, nu:null, cu:null },
  at: null,
  car: '',
  secOrder: ['fl','zo','nu','cu']
};

function load() {
  try { var d = JSON.parse(localStorage.getItem('chaeodie_v1')||'null'); if(d) S=d; } catch(e){}
  if (!S.secOrder) S.secOrder = ['fl','zo','nu','cu'];
}
function persist() {
  try { localStorage.setItem('chaeodie_v1', JSON.stringify(S)); } catch(e){}
}

/* ── CAR NAME ── */
function openCarEdit() {
  document.getElementById('car-display').style.display = 'none';
  var wrap = document.getElementById('car-edit');
  wrap.classList.add('open');
  var inp = document.getElementById('car-input');
  inp.value = S.car || '';
  inp.placeholder = '차 이름 (5자 이내)';
  setTimeout(function(){ inp.focus(); inp.select(); }, 50);
}
function saveCarName() {
  var v = document.getElementById('car-input').value.trim();
  S.car = v;
  persist();
  document.getElementById('car-name-text').textContent = v || '부릉이';
  document.getElementById('car-edit').classList.remove('open');
  document.getElementById('car-display').style.display = 'flex';
  upd();
}

/* ── DISPLAY UPDATE ── */
function upd() {
  var parts = [S.sel.fl, S.sel.zo, S.sel.nu, S.sel.cu].filter(Boolean);
  var bv = document.getElementById('bv');
  var bt = document.getElementById('bt');
  var car = S.car || '부릉이';
  if (parts.length) {
    bv.textContent = car + '  ·  ' + parts.join(' · ');
    bv.classList.remove('empty');
    if (S.at) {
      var d = new Date(S.at);
      bt.textContent = (d.getMonth()+1)+'월 '+d.getDate()+'일 '
        +('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' 저장됨';
    }
  } else {
    bv.textContent = '아직 저장된 위치가 없어요';
    bv.classList.add('empty');
    bt.textContent = '';
  }
}

/* ── TAP ── */
function tap(cat, val) {
  S.sel[cat] = S.sel[cat] === val ? null : val;
  S.at = Date.now();
  persist(); render(); upd();
}

function delFloor(val, e) {
  e.stopPropagation();
  S.floors = S.floors.filter(function(v){return v!==val;});
  if (S.sel.fl === val) S.sel.fl = null;
  persist(); render(); upd();
}
function delCustom(val, e) {
  e.stopPropagation();
  S.customs = S.customs.filter(function(v){return v!==val;});
  if (S.sel.cu === val) S.sel.cu = null;
  persist(); render(); upd();
}

/* ── RENDER ── */
function render() {
  // Floors
  document.getElementById('fl-chips').innerHTML = S.floors.map(function(v, i) {
    var on = S.sel.fl === v;
    var canDel = i >= 2;
    return '<button class="chip'+(on?' on':'')+'" onclick="tap(\'fl\',\''+v+'\')">'+v
      +(canDel?'<span class="del-x" onclick="delFloor(\''+v+'\',event)">✕</span>':'')
      +'</button>';
  }).join('');

  // Zones
  document.getElementById('zo-chips').innerHTML = ZONES.map(function(v){
    return '<button class="chip sm'+(S.sel.zo===v?' on':'')+'" onclick="tap(\'zo\',\''+v+'\')">'+v+'</button>';
  }).join('');

  // Numbers
  var allNums = DNUMS.concat(S.xnums);
  document.getElementById('nu-chips').innerHTML = allNums.map(function(v){
    return '<button class="chip sm'+(S.sel.nu===v?' on':'')+'" onclick="tap(\'nu\',\''+v+'\')">'+v+'</button>';
  }).join('');

  // Custom
  var ce = document.getElementById('cu-chips');
  var ch = document.getElementById('cu-hint');
  if (!S.customs.length) {
    ce.innerHTML = ''; ch.style.display = 'block';
  } else {
    ch.style.display = 'none';
    ce.innerHTML = S.customs.map(function(v){
      var on = S.sel.cu === v;
      return '<button class="chip'+(on?' on':'')+'" onclick="tap(\'cu\',\''+v+'\')">'
        +v+'<span class="del-x" onclick="delCustom(\''+v+'\',event)">✕</span></button>';
    }).join('');
  }

  // section border-radius
  applySectionRadius();
}

function applySectionRadius() {
  var secs = document.querySelectorAll('#sections-wrap .sec');
  secs.forEach(function(s, i) {
    s.style.borderRadius = '';
    s.style.borderTop = '';
    if (i === 0) s.style.borderRadius = '16px 16px 0 0';
    if (i === secs.length - 1) s.style.borderRadius = (secs.length===1?'16px':'0 0 16px 16px');
    if (i > 0) s.style.borderTop = 'none';
  });
}

/* ── EXPAND ── */
function toggleExpand(key) {
  expandState[key] = !expandState[key];
  var el = document.getElementById(key+'-chips');
  var btn = document.getElementById(key+'-exp');
  if (expandState[key]) {
    el.classList.remove('collapsed'); el.classList.add('expanded');
    btn.textContent = '▴ 접기';
  } else {
    el.classList.remove('expanded'); el.classList.add('collapsed');
    btn.textContent = '▾ 더보기';
  }
}

/* ── ADD ── */
function openAdd(t) {
  ['fl','nu','cu'].forEach(function(x){
    document.getElementById(x+'-add').classList.remove('open');
    document.getElementById(x+'-i').value='';
  });
  document.getElementById(t+'-add').classList.add('open');
  setTimeout(function(){ document.getElementById(t+'-i').focus(); }, 50);
}
function closeAdd(t) {
  document.getElementById(t+'-add').classList.remove('open');
  document.getElementById(t+'-i').value='';
}
function doAdd(t) {
  var v = document.getElementById(t+'-i').value.trim();
  if (!v) return;
  if (t==='fl' && !S.floors.includes(v)) S.floors.push(v);
  else if (t==='nu' && !DNUMS.includes(v) && !S.xnums.includes(v)) S.xnums.push(v);
  else if (t==='cu' && !S.customs.includes(v)) S.customs.push(v);
  closeAdd(t); persist(); render(); upd();
}

/* ── CLEAR ── */
function clearSel() {
  if (!confirm('저장된 위치를 초기화할까요?')) return;
  S.sel = {fl:null,zo:null,nu:null,cu:null}; S.at = null;
  persist(); render(); upd();
}

/* ── DRAG & DROP (touch + mouse) ── */
(function() {
  var wrap = document.getElementById('sections-wrap');
  var dragging = null;
  var startY = 0;
  var origIndex = 0;
  var placeholder = null;
  var dragOffsetY = 0;

  function getHandle(el) {
    return el.classList.contains('drag-handle') ? el : el.closest('.drag-handle');
  }

  function getSecs() {
    return Array.from(wrap.querySelectorAll('.sec:not(.dragging)'));
  }

  function startDrag(sec, clientY) {
    dragging = sec;
    var rect = sec.getBoundingClientRect();
    dragOffsetY = clientY - rect.top;
    origIndex = Array.from(wrap.children).indexOf(sec);

    sec.classList.add('dragging');
    sec.style.position = 'fixed';
    sec.style.left = rect.left + 'px';
    sec.style.width = rect.width + 'px';
    sec.style.top = (clientY - dragOffsetY) + 'px';
    sec.style.zIndex = 999;

    placeholder = document.createElement('div');
    placeholder.style.height = rect.height + 'px';
    placeholder.style.background = 'var(--accent-soft)';
    placeholder.style.borderRadius = '12px';
    placeholder.style.border = '2px dashed var(--border)';
    placeholder.style.margin = '0';
    wrap.insertBefore(placeholder, sec.nextSibling);
  }

  function moveDrag(clientY) {
    if (!dragging) return;
    dragging.style.top = (clientY - dragOffsetY) + 'px';

    var secs = getSecs();
    var midY = clientY;
    var insertBefore = null;
    for (var i = 0; i < secs.length; i++) {
      var r = secs[i].getBoundingClientRect();
      if (midY < r.top + r.height / 2) { insertBefore = secs[i]; break; }
    }
    if (insertBefore) {
      wrap.insertBefore(placeholder, insertBefore);
    } else {
      wrap.appendChild(placeholder);
    }
  }

  function endDrag() {
    if (!dragging) return;
    dragging.style.position = '';
    dragging.style.left = '';
    dragging.style.width = '';
    dragging.style.top = '';
    dragging.style.zIndex = '';
    dragging.classList.remove('dragging');
    wrap.insertBefore(dragging, placeholder);
    placeholder.remove();
    placeholder = null;

    // save order
    var newOrder = Array.from(wrap.querySelectorAll('.sec')).map(function(s){ return s.dataset.key; });
    S.secOrder = newOrder;
    persist();
    applySectionRadius();
    dragging = null;
  }

  wrap.addEventListener('mousedown', function(e) {
    var handle = getHandle(e.target);
    if (!handle) return;
    var sec = handle.closest('.sec');
    if (!sec) return;
    e.preventDefault();
    startDrag(sec, e.clientY);
  });
  document.addEventListener('mousemove', function(e) { moveDrag(e.clientY); });
  document.addEventListener('mouseup', endDrag);

  wrap.addEventListener('touchstart', function(e) {
    var handle = getHandle(e.target);
    if (!handle) return;
    var sec = handle.closest('.sec');
    if (!sec) return;
    e.preventDefault();
    startDrag(sec, e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (dragging) { e.preventDefault(); moveDrag(e.touches[0].clientY); }
  }, { passive: false });
  document.addEventListener('touchend', endDrag);
})();

/* ── RESTORE SECTION ORDER ── */
function restoreOrder() {
  var wrap = document.getElementById('sections-wrap');
  if (!S.secOrder) return;
  S.secOrder.forEach(function(key) {
    var el = wrap.querySelector('[data-key="'+key+'"]');
    if (el) wrap.appendChild(el);
  });
}

/* ── INIT ── */
load();
restoreOrder();
document.getElementById('car-name-text').textContent = S.car || '부릉이';
render();
upd();
</script>
